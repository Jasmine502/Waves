<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waves</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Fredoka One', cursive;
            background-color: #0072ff; /* Fallback color */
        }
        canvas {
            display: block;
        }
        .modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            background-color: rgba(0, 0, 0, 0.75);
            padding: 40px 60px;
            border-radius: 25px;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
            border: 4px solid white;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.6);
            width: 80%;
            max-width: 800px;
        }
        .modal h1 {
            font-size: 4.5em;
            margin: 0 0 10px 0;
            color: #ffc107;
        }
        .modal p {
            font-size: 1.5em;
            margin: 5px 0;
        }
        .modal .final-score {
            font-size: 2em;
            margin-top: 20px;
            color: #8aff8a;
        }
        .upgrade-container {
            display: flex;
            justify-content: space-around;
            margin-top: 30px;
            gap: 20px;
        }
        .upgrade-choice {
            background: rgba(0, 0, 0, 0.4);
            border: 3px solid #ffc107;
            border-radius: 15px;
            padding: 20px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            flex: 1;
        }
        .upgrade-choice:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px #ffc107;
        }
        .upgrade-choice h3 {
            margin: 0 0 10px 0;
            font-size: 1.5em;
            color: #ffc107;
        }
        .upgrade-choice .buff {
            color: #8aff8a;
            font-size: 1.1em;
        }
        .upgrade-choice .debuff {
            color: #ff8a8a;
            font-size: 1.1em;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let score = 0;
        let highScore = localStorage.getItem('wavesHighScore') || 0;
        let gameState = 'start'; // 'start', 'playing', 'upgrade', 'gameOver', 'getReady'
        let buoys = [];
        let particles = [];
        let currentEquation = {};
        let buoySpeed = 1.5;
        let lives = 9;
        let scoreMultiplier = 1;
        let waitingForNextWave = false;
        let questionCount = 0;
        let waveCount = 1;

        // Image assets
        const catImage = new Image();
        catImage.src = 'https://i.imgur.com/1Ui2IWx.png';
        const buoyImage = new Image();
        buoyImage.src = 'https://i.imgur.com/Oj7SM9w.png';

        // Player setup for smoother movement
        const player = {
            width: 121,
            height: 110,
            x: 0, 
            y: 0, 
            acceleration: 0.15, // Reduced from 0.2
            friction: 0.97, // Reduced from 0.98
            velocityX: 0,
            velocityY: 0,
            maxSpeed: 3 // Reduced from 4
        };
        
        // --- Upgrades ---
        const ALL_UPGRADES = [
            { 
                id: 'speed_demon',
                title: 'Speed Demon',
                buff: 'BUFF: Surf much faster.',
                debuff: 'DEBUFF: Buoys are faster.',
                minWave: 1,
                apply: () => {
                    player.maxSpeed += 1.5;
                    buoySpeed += 0.4;
                }
            },
            {
                id: 'slippery_surfer',
                title: 'Slippery Surfer',
                buff: 'BUFF: Glide for longer.',
                debuff: 'DEBUFF: Slower to turn.',
                minWave: 1,
                apply: () => {
                    player.friction += 0.01;
                    player.acceleration -= 0.05;
                }
            },
            {
                id: 'small_target',
                title: 'Small Target',
                buff: 'BUFF: You are 15% smaller.',
                debuff: 'DEBUFF: Buoys are 10% smaller.',
                minWave: 1,
                apply: () => {
                    player.width *= 0.85;
                    player.height *= 0.85;
                    buoyRadiusModifier *= 0.90;
                }
            },
            {
                id: 'time_dilation',
                title: 'Time Dilation',
                buff: 'BUFF: Buoys are much slower.',
                debuff: 'DEBUFF: You are also slower.',
                minWave: 2,
                apply: () => {
                    buoySpeed *= 0.75;
                    player.maxSpeed *= 0.85;
                }
            },
            {
                id: 'wide_net',
                title: 'Wide Net',
                buff: 'BUFF: Gain a life.',
                debuff: 'DEBUFF: Buoys move more erratically.',
                minWave: 3,
                apply: () => {
                    lives++;
                    buoyBobAmount += 15;
                }
            },
            {
                id: 'nine_lives',
                title: 'Nine Lives',
                buff: 'BUFF: Gain 2 extra lives.',
                debuff: 'DEBUFF: Buoys are slightly faster.',
                minWave: 2,
                apply: () => { 
                    lives += 2; 
                    buoySpeed += 0.2; 
                }
            },
            {
                id: 'glass_cannon',
                title: 'Glass Cannon',
                buff: 'BUFF: Huge speed boost.',
                debuff: 'DEBUFF: Lose 2 lives.',
                minWave: 3,
                apply: () => { 
                    player.maxSpeed += 2.5; 
                    player.acceleration += 0.1; 
                    lives -= 2; 
                }
            },
            {
                id: 'high_stakes',
                title: 'High Stakes',
                buff: 'BUFF: Score is doubled for the next wave.',
                debuff: 'DEBUFF: Lose a life.',
                minWave: 4,
                apply: () => { 
                    scoreMultiplier = 2; 
                    lives--; 
                }
            }
        ];
        
        let buoyRadiusModifier = 1.0;
        let hasExtraLife = false; // This is now effectively replaced by the lives system but kept for upgrade logic.
        let buoyBobAmount = 10;


        // --- Keyboard Input ---
        const keys = {
            w: false, a: false, s: false, d: false,
            ArrowUp: false, ArrowLeft: false, ArrowDown: false, ArrowRight: false
        };

        function handleKeyDown(e) {
            if (keys.hasOwnProperty(e.key)) {
                e.preventDefault();
                keys[e.key] = true;
            }
            if ((gameState === 'start' || gameState === 'gameOver') && e.key === 'Enter') {
                startGame();
            }
        }

        function handleKeyUp(e) {
            if (keys.hasOwnProperty(e.key)) {
                e.preventDefault();
                keys[e.key] = false;
            }
        }
        
        document.addEventListener('keydown', handleKeyDown);
        document.addEventListener('keyup', handleKeyUp);

        // --- Game Logic ---
        function startGame() {
            score = 0;
            lives = 9;
            scoreMultiplier = 1;
            questionCount = 0;
            waveCount = 1;
            buoySpeed = 1.5;
            buoyRadiusModifier = 1.0;
            hasExtraLife = false;
            buoyBobAmount = 10;
            
            player.width = 121;
            player.height = 110;
            player.acceleration = 0.15; // Reduced from 0.2
            player.friction = 0.97; // Reduced from 0.98
            player.maxSpeed = 3; // Reduced from 4

            waitingForNextWave = false;
            player.velocityX = 0;
            player.velocityY = 0;
            player.x = 100;
            player.y = canvas.height / 2 - player.height / 2;
            hideModal();
            prepareNextWave();
        }
        
        function prepareNextWave() {
            waitingForNextWave = false;
            buoys = [];
            currentEquation = generateEquation();
            scoreMultiplier = 1; // Reset score multiplier each wave
            generateNewProblem(); // No more 'Ready?' state, generate problem immediately
        }

        function generateNewProblem() {
            hasExtraLife = false; // Extra life is per-wave
            gameState = 'playing';
            const answers = generateAnswers(currentEquation.answer);
            
            let currentX = canvas.width + 150;
            for (let i = 0; i < 3; i++) {
                const buoyRadius = 54 * buoyRadiusModifier;
                const initialY = Math.random() * (canvas.height - buoyRadius * 2 - 100) + buoyRadius + 50;
                buoys.push({
                    x: currentX,
                    y: initialY,
                    initialY: initialY,
                    radius: buoyRadius,
                    value: answers[i],
                    bobAngle: Math.random() * Math.PI * 2
                });
                currentX += 200 + Math.random() * 100;
            }
        }

        function generateEquation() {
            const operators = ['+', '-', '*', '/'];
            const operator = operators[Math.floor(Math.random() * operators.length)];
            let num1, num2, answer;
            let difficulty = Math.min(1 + waveCount * 0.5, 5);

            switch (operator) {
                case '+':
                    num1 = Math.floor(Math.random() * (15 + 5 * difficulty)) + waveCount;
                    num2 = Math.floor(Math.random() * (15 + 5 * difficulty)) + waveCount;
                    answer = num1 + num2;
                    break;
                case '-':
                    num1 = Math.floor(Math.random() * (15 + 5 * difficulty)) + (10 + waveCount);
                    num2 = Math.floor(Math.random() * (num1 - 1)) + 1;
                    answer = num1 - num2;
                    break;
                case '*':
                    num1 = Math.floor(Math.random() * (8 + waveCount)) + 2;
                    num2 = Math.floor(Math.random() * (8 + waveCount)) + 2;
                    answer = num1 * num2;
                    break;
                case '/':
                    num2 = Math.floor(Math.random() * (8 + waveCount)) + 2;
                    answer = Math.floor(Math.random() * 10) + waveCount;
                    num1 = num2 * answer;
                    break;
            }

            return { question: `${num1} ${operator.replace('*', '×').replace('/', '÷')} ${num2}`, answer };
        }
        
        function generateAnswers(correctAnswer) {
             let answers = [correctAnswer];
             while (answers.length < 3) {
                 const offset = Math.floor(Math.random() * 10) + 1;
                 const wrongAnswer = Math.random() > 0.5 ? correctAnswer + offset : correctAnswer - offset;
                 if (!answers.includes(wrongAnswer) && wrongAnswer > 0) {
                     answers.push(wrongAnswer);
                 }
             }
             return answers.sort(() => Math.random() - 0.5);
        }

        function gameOver() {
            gameState = 'gameOver';
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('wavesHighScore', highScore);
            }
            showModal();
        }

        function updatePlayerPosition() {
            if (keys.a || keys.ArrowLeft) player.velocityX -= player.acceleration;
            if (keys.d || keys.ArrowRight) player.velocityX += player.acceleration;
            if (keys.w || keys.ArrowUp) player.velocityY -= player.acceleration;
            if (keys.s || keys.ArrowDown) player.velocityY += player.acceleration;

            const speed = Math.sqrt(player.velocityX * player.velocityX + player.velocityY * player.velocityY);
            if (speed > player.maxSpeed) {
                player.velocityX = (player.velocityX / speed) * player.maxSpeed;
                player.velocityY = (player.velocityY / speed) * player.maxSpeed;
            }

            player.velocityX *= player.friction;
            player.velocityY *= player.friction;
            player.x += player.velocityX;
            player.y += player.velocityY;

            if (player.x < 0) player.x = 0;
            if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;
            if (player.y < 0) player.y = 0;
            if (player.y + player.height > canvas.height) player.y = canvas.height - player.height;
        }

        function updateBuoys() {
            let allBuoysOffScreen = true;
            buoys.forEach(buoy => {
                buoy.x -= buoySpeed;
                buoy.bobAngle += 0.05;
                buoy.y = buoy.initialY + Math.sin(buoy.bobAngle) * buoyBobAmount;
                if (buoy.x + buoy.radius > 0) allBuoysOffScreen = false;
            });

            if(allBuoysOffScreen && buoys.length > 0 && gameState !== 'upgrade') {
                if (waitingForNextWave) {
                    prepareNextWave();
                } else {
                    // This logic triggers if the player misses all buoys
                    lives--;
                    if (lives <= 0) {
                        gameOver();
                    } else {
                        // Still have lives, so just start the next wave
                        waitingForNextWave = true;
                    }
                }
            }
        }
        
        function checkCollisions() {
            if (waitingForNextWave) return;

            buoys.forEach((buoy, index) => {
                const playerCenterX = player.x + player.width / 2;
                const playerCenterY = player.y + player.height / 2;
                const dx = playerCenterX - buoy.x;
                const dy = playerCenterY - buoy.y;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < buoy.radius + (player.width / 4)) {
                    handleCollision(buoy, index);
                }
            });
        }
        
        function handleCollision(buoy, index) {
            if (buoy.value === currentEquation.answer) {
                score += (1 * scoreMultiplier);
                createSplash(buoy.x, buoy.y);
                buoySpeed += 0.1;
                buoys.splice(index, 1);
                questionCount++;

                if (questionCount % 4 === 0) {
                    waveCount++;
                    gameState = 'upgrade';
                    showModal();
                } else {
                    waitingForNextWave = true;
                }
            } else {
                lives--;
                createSplash(buoy.x, buoy.y, false);
                buoys.splice(index, 1);
                waitingForNextWave = true; // Move to next wave after wrong answer
                if (lives <= 0) {
                    gameOver();
                }
            }
        }
        
        function createSplash(x, y, isCorrect = true) {
            const particleCount = 20;
            const color = isCorrect ? '#8aff8a' : '#ff8a8a';
            for (let i = 0; i < particleCount; i++) {
                particles.push({
                    x,
                    y,
                    velocityX: (Math.random() - 0.5) * 4,
                    velocityY: (Math.random() - 0.5) * 4,
                    size: Math.random() * 5 + 2,
                    lifespan: 60,
                    color: color
                });
            }
        }
        
        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.velocityX;
                p.y += p.velocityY;
                p.lifespan--;
                if (p.lifespan <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        // --- Drawing ---
        const waves = [];
        function setupWaves() {
            waves.length = 0;
            for (let i = 0; i < 5; i++) {
                waves.push({
                    y: canvas.height * (0.5 + i * 0.1),
                    xOffset: Math.random() * Math.PI * 2,
                    amplitude: Math.random() * 20 + 20,
                    speed: (0.5 + i * 0.2) * 0.02,
                    frequency: 0.01 - i * 0.002,
                    color: `rgba(255, 255, 255, ${0.05 + i * 0.05})`
                });
            }
        }

        function drawBackground() {
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#00c6ff');
            gradient.addColorStop(1, '#0072ff');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            waves.forEach(wave => {
                ctx.beginPath();
                ctx.moveTo(0, canvas.height);
                ctx.lineTo(0, wave.y);
                for (let x = 0; x <= canvas.width; x += 20) { // Optimized loop
                    const y = wave.y + Math.sin(x * wave.frequency + wave.xOffset) * wave.amplitude;
                    ctx.lineTo(x, y);
                }
                ctx.lineTo(canvas.width, wave.y);
                ctx.lineTo(canvas.width, canvas.height);
                ctx.closePath();
                ctx.fillStyle = wave.color;
                ctx.fill();
                wave.xOffset += wave.speed;
            });
        }
        
        function drawParticles() {
             particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.lifespan / 60;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1.0;
        }

        function drawPlayer() {
            if (catImage.complete) {
                ctx.drawImage(catImage, player.x, player.y, player.width, player.height);
            }
        }

        function drawBuoys() {
             if (!buoyImage.complete || buoyImage.naturalWidth === 0) return;
            buoys.forEach(buoy => {
                const buoySize = buoy.radius * 2;
                const aspectRatio = buoyImage.naturalHeight / buoyImage.naturalWidth;
                const buoyWidth = buoySize;
                const buoyHeight = buoySize * aspectRatio;

                ctx.drawImage(buoyImage, buoy.x - buoyWidth / 2, buoy.y - buoyHeight / 2, buoyWidth, buoyHeight);

                ctx.font = `bold ${Math.round(48 * buoyRadiusModifier)}px "Fredoka One"`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.strokeStyle = 'black';
                ctx.lineWidth = 8;
                ctx.strokeText(buoy.value, buoy.x, buoy.y + 5);
                ctx.fillStyle = 'white';
                ctx.fillText(buoy.value, buoy.x, buoy.y + 5);
            });
        }
        
        function drawUI() {
            ctx.fillStyle = 'white';
            ctx.font = '30px "Fredoka One"';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            ctx.fillText(`Score: ${score}`, 20, 20);
            ctx.fillText(`Wave: ${waveCount}`, 20, 60);
            ctx.fillText(`Lives: ${'❤️'.repeat(lives)}`, 20, canvas.height - 50);
            
            ctx.textAlign = 'right';
            ctx.fillText(`High Score: ${highScore}`, canvas.width - 20, 20);
            
            ctx.textAlign = 'center';
            ctx.font = '50px "Fredoka One"';
            ctx.shadowColor = 'rgba(0,0,0,0.5)';
            ctx.shadowBlur = 5;
            
            if (gameState === 'playing') {
                ctx.fillText(currentEquation.question, canvas.width / 2, 30);
            }
            // Removed 'Ready?' text logic
            ctx.shadowBlur = 0;
        }
        
        function getUpgrades() {
            const available = ALL_UPGRADES.filter(u => waveCount >= u.minWave);
            return available.sort(() => 0.5 - Math.random()).slice(0, 3);
        }

        function applyUpgrade(upgrade) {
            upgrade.apply();
            
            if (lives <= 0) {
                // If an upgrade debuff causes game over
                hideModal();
                gameOver();
            } else {
                hideModal();
                prepareNextWave();
            }
        }

        function showModal() {
            let modal = document.querySelector('.modal');
            if (!modal) {
                modal = document.createElement('div');
                modal.className = 'modal';
                document.body.appendChild(modal);
            }
            
            let content;
            if (gameState === 'start') {
                content = `
                    <h1>Waves</h1>
                    <p>Use WASD or Arrow Keys to surf!</p>
                    <p>Surf into the buoy with the correct answer.</p>
                    <p>Press ENTER to Start</p>
                `;
            } else if (gameState === 'upgrade') {
                const upgrades = getUpgrades();
                let upgradeChoicesHTML = upgrades.map(upgrade => `
                    <div class="upgrade-choice" id="upgrade-${upgrade.id}">
                        <h3>${upgrade.title}</h3>
                        <p class="buff">${upgrade.buff}</p>
                        <p class="debuff">${upgrade.debuff}</p>
                    </div>
                `).join('');

                content = `
                    <h1>Choose an Upgrade!</h1>
                    <p>Wave ${waveCount} Complete!</p>
                    <div class="upgrade-container">
                        ${upgradeChoicesHTML}
                    </div>
                `;
                modal.innerHTML = content;

                upgrades.forEach(upgrade => {
                    document.getElementById(`upgrade-${upgrade.id}`).onclick = () => applyUpgrade(upgrade);
                });

            } else { // gameOver
                 content = `
                    <h1>Game Over</h1>
                    <p class="final-score">Final Score: ${score}</p>
                    <p>Press ENTER to Play Again</p>
                `;
            }

            if (gameState !== 'upgrade') {
                 modal.innerHTML = content;
            }
            modal.style.display = 'block';
        }

        function hideModal() {
            const modal = document.querySelector('.modal');
            if (modal) modal.style.display = 'none';
        }

        function gameLoop() {
            if (gameState === 'playing') {
                updatePlayerPosition();
                checkCollisions();
            }
            // Removed 'getReady' state logic

            if (gameState === 'playing' || gameState === 'upgrade') { // Removed 'getReady'
                 updateBuoys();
            }
            updateParticles();
            
            drawBackground();

            if (gameState === 'playing' || gameState === 'upgrade') { // Removed 'getReady'
                drawBuoys();
                drawPlayer();
            }
            drawParticles();
            drawUI();
            
            requestAnimationFrame(gameLoop);
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            if(gameState !== 'playing') {
                player.x = 100;
                player.y = canvas.height / 2 - player.height / 2;
            }
            setupWaves();
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        showModal();
        gameLoop();

    </script>
</body>
</html>
